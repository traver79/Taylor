<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swiftie Universe</title>
  <meta name="description" content="Tu universo Taylor Swift — canciones, favoritas, letras y más." />
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a0a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Swiftie" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-star">✦</span>
        <span class="logo-text">Swiftie Universe</span>
        <span class="logo-star">✦</span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="albums">Álbumes</button>
        <button class="tab" data-tab="favorites">Favoritas <span id="fav-count" class="fav-badge"></span></button>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main>

    <!-- ALBUMS VIEW -->
    <section id="view-albums" class="view active">
      <div class="albums-grid" id="albums-grid"></div>
    </section>

    <!-- FAVORITES VIEW -->
    <section id="view-favorites" class="view">
      <div class="favorites-header">
        <h2 class="section-title">Tus Canciones Favoritas</h2>
        <p class="section-subtitle" id="fav-subtitle">Guarda canciones tocando el ♡</p>
      </div>
      <div class="songs-list" id="favorites-list"></div>
    </section>

  </main>

  <!-- SONG MODAL -->
  <div id="song-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-header">
        <div class="modal-album-color" id="modal-color"></div>
        <div>
          <h2 class="modal-song-title" id="modal-title"></h2>
          <p class="modal-album-name" id="modal-album"></p>
        </div>
        <button class="modal-fav-btn" id="modal-fav">♡</button>
      </div>

      <div class="modal-actions">
        <a id="modal-spotify" class="action-btn spotify-btn" href="#" target="_blank">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
          Escuchar en Spotify
        </a>
        <a id="modal-youtube" class="action-btn youtube-btn" href="#" target="_blank">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          Ver en YouTube
        </a>
        <a id="modal-lyrics" class="action-btn lyrics-btn" href="#" target="_blank">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Seguir la Letra
        </a>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
